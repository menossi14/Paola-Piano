name: Build Dark Piano PWA icons
on:
  push:
    branches: [main]
    paths:
      - icon-dark-piano.svg
      - .github/workflows/build-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG to Android PNG assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icon-dark-piano.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon-dark-piano.svg -o icon-512.png
      - name: Commit icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Render Dark Piano icon for Android" && git push)
